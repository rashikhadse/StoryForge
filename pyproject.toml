[project]
name = "storyforge"
version = "0.1.0"
description = "LangGraph multi-agent pipeline that turns public-domain stories into Hindi/English microdrama scripts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rashi Rahul Khadse" }]
dependencies = [
  "langgraph>=1.0", "openai>=1.40", "pydantic>=2.7", "qdrant-client>=1.12", "fastembed>=0.4",
  "numpy>=1.26", "fastapi>=0.110", "uvicorn[standard]>=0.29", "tenacity>=8.2", "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
tracing = ["langfuse>=3"]

[project.scripts]
storyforge = "storyforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["storyforge*"]

[tool.setuptools.package-data]
storyforge = ["prompts/*.md", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
